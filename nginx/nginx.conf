map $http_origin $allow_origin {
  ~^https?://(.*\.)?sims.co.uk(:\d+)?$ $http_origin;
  default "";
}

server {
  listen 80;

  location / {
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' $allow_origin;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, HEAD';
      add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,Keep-Alive,Origin,request-id,Organisation-Id,traceparent';
      add_header Cache-Control "private, no-cache, no-store, must-revalidate";
      return 204;
    }
    add_header Allow "GET, OPTIONS";
    add_header 'Access-Control-Allow-Origin' $allow_origin;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, HEAD';
    add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,Keep-Alive,Origin,request-id,Organisation-Id,traceparent';
    add_header Cache-Control "private, no-cache, no-store, must-revalidate";

    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  location /api {
    proxy_pass http://ng-home-api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header 'Access-Control-Allow-Origin' $allow_origin always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, HEAD' always;
    add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,Keep-Alive,Origin,request-id,Organisation-Id,traceparent' always;
    expires -1;
    add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
  }


  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}