map $http_origin $allow_origin {
  ~^https?://(.*\.)?sims.co.uk(:\d+)?$ $http_origin;
  default "";
}

server {
  listen 80;

    location /embed/medias/ {
    # Custom headers for Wistia embed medias
    add_header 'X-Wistia-Header' 'enabled' always;
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;

    # If you need to proxy to Wistia, uncomment below:
    proxy_pass https://fast.wistia.net;
  }

  location /mput {
    # Custom headers for Wistia metrics
    add_header 'X-Wistia-Header' 'enabled' always;
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;

    # If you need to proxy to Wistia, uncomment below:
    proxy_pass https://pipedream.wistia.com;
  }
  
  location / {
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' $allow_origin always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, HEAD' always;
      add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,Keep-Alive,Origin,traceparent,request-id' always;
      expires -1;
      add_header Cache-Control "private, no-cache, no-store";
      return 204;
    }
    add_header Allow "GET, POST, HEAD, OPTIONS";
    add_header "Access-Control-Allow-Origin" $allow_origin always;
    add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS, PUT, DELETE, HEAD" always;
    add_header "Access-Control-Allow-Headers" "Accept,Authorization,Cache-Control,Content-Type,Keep-Alive,Origin,traceparent,request-id" always;
    expires -1;
    add_header Cache-Control "private, no-cache, no-store";

    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  # ---------------------------------------
  # WISTIA REVERSE PROXY (CORS SAFE)
  #
  # Call from frontend as:
  #   /wistia/assets/external/E-v1.js
  #   /wistia/embed/medias/abc123.json
  # ---------------------------------------
  location /wistia/ {

    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' $allow_origin always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, HEAD' always;
      add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,Keep-Alive,Origin,traceparent,request-id' always;
      return 204;
    }

    add_header "Access-Control-Allow-Origin" $allow_origin always;
    add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS, PUT, DELETE, HEAD" always;
    add_header "Access-Control-Allow-Headers" "Accept,Authorization,Cache-Control,Content-Type,Keep-Alive,Origin,traceparent,request-id" always;

    proxy_pass https://fast.wistia.com/;
    proxy_set_header Host fast.wistia.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header 'Access-Control-Allow-Origin' $allow_origin always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, HEAD' always;
    add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,Keep-Alive,Origin,request-id,Organisation-Id,traceparent' always;
    expires -1;
    add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
  }

  location /api {
    proxy_pass http://ng-home-api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header 'Access-Control-Allow-Origin' $allow_origin always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, HEAD' always;
    add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,Keep-Alive,Origin,request-id,Organisation-Id,traceparent' always;
    expires -1;
    add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
  }



  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}