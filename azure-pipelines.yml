trigger:
- main

schedules:
  - cron: "30 01 * * 3"
    displayName: "Kiuwan Baseline"
    branches:
      include:
        - main
    always: true

resources:
  repositories:
    - repository: platformPipelineRepo
      type: git
      name: Platform/az-pipelines-application-yaml-kit
      ref: refs/tags/releases/2.2.0

variables:
  - group: ng-home-ui-Dev
  - name: tag
    value: '$(Build.BuildId)'
  - name: buildConfiguration
    value: 'Release'
  - name: location
    value: 'South UK'
  - name: acrName
    value: 'pazshdpfmconrg'
  - name: imageName
    value: 'ng-home-ui'
  - name: acr_url
    value: 'pazshdpfmconrg.azurecr.io'

pool:
  name: paz-vmss-pool

stages:
  - stage: Build
    jobs:
      - job: BuildApplication
        timeoutInMinutes: 20
        cancelTimeoutInMinutes: 3
        displayName: "Install, lint, test & build"
        steps:
          - task: Bash@3
            displayName: "Create npmrc for artifact permission"
            inputs:
              targetType: "inline"
              script: |
                sed -i 's-azureArtifactPAT-$(azureArtifactPAT)-g' usernpmrc.txt
                cat usernpmrc.txt 
                mv -v usernpmrc.txt /home/$USER/.npmrc
          
          - task: Bash@3
            inputs:
              targetType: inline
              script: |
                ls
                cat .npmrc                              
          
          - task: NodeTool@0
            inputs:
              versionSource: 'spec'
              versionSpec: '16.14.2'
            displayName: "Install Node.js"
          - script: |
              echo "Check version"
              which node
              echo "Node Version: " 
              node -v
              echo "NPM Version: " 
              npm -v
            displayName: "Node Version check"
          - script: npm install
            displayName: "Installing Package"
          # - script: npm audit
          #   displayName: "Audit vulnerabilities in packages"
          - script: CI=true npm run coverage
            displayName: "Test with coverage"
          - script: npm run eslint:check
            displayName: "Typescript Linting"
          # - script: npm run stylelint:check
          #   displayName: "Style Linting"
          - script: npm run build
            displayName: "Application Build"
            env:
              CI: true      
          - script: npm run build:singlespa
            displayName: "Micro frontend Build"
            env:
              CI: true

          - script: |
              FORMATTEDMESSAGE=$(echo '$(Build.SourceVersionMessage)' | sed -r 's/[#]+/:/g')
              echo "##vso[task.setvariable variable=commitMessage]$FORMATTEDMESSAGE"
            displayName: "Format Commit Message"   
          
          # - task: Bash@3
          #   displayName: 'Secret scanning' 
          #   inputs:
          #     targetType: 'inline'
          #     script: |
          #       docker build -t staff-ui-scanner -f ./.husky/talisman/CI.Dockerfile . || exit 1
          #       docker run staff-ui-scanner || exit 1
          #     workingDirectory: '$(System.DefaultWorkingDirectory)'

##=============================================================================================== 
          - script: |
              az login --identity
              az account set --subscription 74a57460-013e-4db0-850b-86c4d083c797
              KIUWAN_PWD=`az keyvault secret show --name 'Platform-BuildAgent-kiuwan-password' --vault-name 'kv-dev-platform-001' --query 'value' --output tsv`
              LOC=$(curl -i --user Platform-BuildAgent:$KIUWAN_PWD https://api.kiuwan.com/stats/)
              JSON=$(echo "$LOC" | grep -o '\[.*\]')
              HLOC=$(echo $JSON | jq -r '.[] | select(.name == "24hlocs") | .value')
              echo "HLOC value: $HLOC"
              if (( $HLOC < 1990000 )); then
                SKIPKIUWAN="no"
              else
                SKIPKIUWAN="yes"
              fi
              echo "do we skip Kiuwan: $SKIPKIUWAN"
              echo "##vso[task.setvariable variable=skipKiuwan;isOutput=true;]$SKIPKIUWAN"
            name: loclimit
            displayName: "Kiuwan Get LOC Limit"

          - script: |
              if [ -f "/datadrive/_work/_tool/KiuwanLocalAnalyzer/1.0.0/x64/KiuwanLocalAnalyzer/temp/agent.lock" ]; then
                echo "lock file exists removing..."
                rm /datadrive/_work/_tool/KiuwanLocalAnalyzer/1.0.0/x64/KiuwanLocalAnalyzer/temp/agent.lock
              else
                echo "file does not exist"
              fi
            displayName: "🧹 Remove Kiuwan lock file"                      
##===============================================================================================

          - task: kiuwan-delivery-analysis-task@2
            displayName: "Kiuwan Delivery Analysis"
            inputs:
              kiuwanConnection: 'Kiuwan-Platform-BuildAgentConnection'
              projectnameselector: 'kiuwanapp'
              kiuwanappname: 'ng-home-ui-new'
              changerequest: 'ng-home-ui - $(Build.SourceBranchName)'
              overridedeliverylabel: true
              deliverylabel: "$(Build.BuildNumber)-$(commitMessage)"
              analysisscope: "completeDelivery"
              includeinsight: true
              failonaudit: true
              uploadsnippets: true
              uploadfiles: false
              skipclones: false
              overridedotkiuwan: false
              excludepatterns: '**/__MACOSX/**,**/*.min.js,**/Pods/BuildHeaders/**/*.h,**/Pods/Headers/**/*.h,**/node_modules/**,**/bower_components/**,**/target/**,**/bin/**,**/obj/**,**/dist/**,**/lib/**,**/bootstrap*.js,**/jquery*.js,**/umd/**,**/esm/**,**/fontawesome/**,**/coverage/**,**/__test__/**,**/__tests__/**,**/config/**,**/singleSpa/**,**/*.config.js,**/lighthouse/**'
              dbanalysis: false
            condition: and(succeeded(), ne(variables['Build.Reason'], 'Schedule'), ne(variables['loclimit.skipKiuwan'], 'yes'))
            
          - task: kiuwan-baseline-analysis-task@2
            displayName: 'Kiuwan Baseline Analysis'
            inputs:
              kiuwanConnection: 'Kiuwan-Platform-BuildAgentConnection'
              projectnameselector: 'kiuwanapp'
              kiuwanappname: 'ng-home-ui-new'
              includeinsight: true
              uploadsnippets: true
              uploadfiles: false
              skipclones: false
              overridedotkiuwan: false
              overrideappmodel: false
              excludepatterns: '**/__MACOSX/**,**/*.min.js,**/Pods/BuildHeaders/**/*.h,**/Pods/Headers/**/*.h,**/node_modules/**,**/bower_components/**,**/target/**,**/bin/**,**/obj/**,**/dist/**,**/lib/**,**/bootstrap*.js,**/jquery*.js,**/umd/**,**/esm/**,**/fontawesome/**,**/coverage/**,**/__test__/**,**/__tests__/**,**/config/**,**/singleSpa/**,**/*.config.js,**/lighthouse/**'
              dbanalysis: false
            condition: and(succeeded(), eq(variables['Build.Reason'], 'Schedule'), ne(variables['loclimit.skipKiuwan'], 'yes'))
          
          - task: PublishTestResults@2
            displayName: "Publish Test Results"
            inputs:
              testResultsFiles: junit.xml
              mergeTestResults: true
            condition: succeededOrFailed()
         
          - task: PublishCodeCoverageResults@1
            displayName: "Publish Code Coverage"
            inputs:
              codeCoverageTool: Cobertura
              summaryFileLocation: "./coverage/cobertura-coverage.xml"
              reportDirectory: "app/coverage"
              failIfCoverageEmpty: true
            
          - task: BuildQualityChecks@8
            displayName: "Build Quality Checks for lines"
            inputs:
              checkCoverage: true
              coverageFailOption: "fixed"
              coverageType: "lines"
              coverageThreshold: "85"
              explicitFilter: true
              treat0of0as100: true

          - task: Bash@3
            displayName: 'Build image'
            inputs:
              targetType: 'inline'
              script: |
                docker build -t $(imageName) .       
                docker tag $(imageName):latest $(acr_url)/$(imageName):$(Build.BuildId) 

          - task: Bash@3
            displayName: 'Push image'
            inputs:
              targetType: 'inline'
              script: |
                az login --identity
                az acr login --name $(acr_url)
                docker push $(acr_url)/$(imageName):$(Build.BuildId)

          - task: CopyFiles@2
            inputs:
              Contents: "deployment.yaml"
              TargetFolder: "$(Build.ArtifactStagingDirectory)"
            
          - task: CopyFiles@2
            inputs:
              Contents: "deployment-live.yaml"
              TargetFolder: "$(Build.ArtifactStagingDirectory)"
              
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    - stage: dev
      displayName: Deployment to Dev
      dependsOn: Build
      pool:
        name: 'paz-vmss-pool'
      variables:
        - group: 'ng-home-ui-Dev'
      jobs:
        - deployment: Deploy_nghomeui_Dev
          displayName: "Deployment to Dev"
          environment: dev_eng             
          strategy:
            runOnce:
              deploy:
                steps:
                  - task: DownloadPipelineArtifact@2
                    inputs:
                      buildType: 'current'
                      artifactName: 'drop'
                      targetPath: '$(Pipeline.Workspace)/drop'
                  
                  - task: Bash@3
                    inputs:
                      targetType: 'inline'
                      script: |
                        # Write your commands here                  
                        echo 'Hello world'                  
                        curl -LO https://github.com/Azure/kubelogin/releases/download/v0.1.4/kubelogin-linux-amd64.zip
                        unzip kubelogin-linux-amd64.zip
                        sudo install bin/linux_amd64/kubelogin /usr/local/bin

                  - task: replacetokens@5
                    displayName: 'Replace Token in Deployment.YAML'
                    inputs:
                        rootDirectory: '$(Pipeline.Workspace)/drop'
                        targetFiles: 'deployment.yaml'
                        encoding: 'auto'
                        tokenPattern: 'default'
                        writeBOM: true
                        actionOnMissing: 'warn'
                        keepToken: false
                        actionOnNoFiles: 'continue'
                        enableTransforms: false
                        enableRecursion: false
                        useLegacyPattern: false
                        enableTelemetry: true   

                  - task: Bash@3
                    displayName: 'Kubectl apply'
                    inputs:
                      targetType: 'inline'
                      script: |
                        cd $(Pipeline.Workspace)/drop
                        az login --identity
                        az account set --subscription 74a57460-013e-4db0-850b-86c4d083c797
                        az aks get-credentials --resource-group paz-dev-pfm-rg --name paz-dev-pfm-aks --overwrite-existing 2> /dev/null
                        kubelogin convert-kubeconfig -l azurecli
                        kubectl apply -f deployment.yaml                        
                      failOnStderr: true
                  
                  - template: azure-deployment-pipeline.yaml
                    parameters:
                      rgName: "paz-dev-pfm-rg"
                      clusterName: "paz-dev-pfm-aks"
                      subscription_id: "74a57460-013e-4db0-850b-86c4d083c797"
  
  - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}: 
    - stage: qa
      displayName: Deployment to Qa
      dependsOn: dev
      pool:
        name: 'paz-vmss-pool'
      variables:
        - group: 'ng-home-ui-QA'
      jobs:
        - deployment: deploy_nghomeui_qa_eng
          displayName: "Deployment to QA"
          environment: qa_eng          
          strategy:
            runOnce:
              deploy:
                steps:
                  - task: DownloadPipelineArtifact@2
                    inputs:
                      buildType: 'current'
                      artifactName: 'drop'
                      targetPath: '$(Pipeline.Workspace)/drop'     

                  - task: Bash@3
                    inputs:
                      targetType: 'inline'
                      script: |
                        # Write your commands here                  
                        echo 'Hello world'                  
                        curl -LO https://github.com/Azure/kubelogin/releases/download/v0.1.4/kubelogin-linux-amd64.zip
                        unzip kubelogin-linux-amd64.zip
                        sudo install bin/linux_amd64/kubelogin /usr/local/bin     

                  - task: replacetokens@5
                    displayName: 'Replace Token in Deployment.YAML'
                    inputs:
                        rootDirectory: '$(Pipeline.Workspace)/drop'
                        targetFiles: 'deployment.yaml'
                        encoding: 'auto'
                        tokenPattern: 'default'
                        writeBOM: true
                        actionOnMissing: 'warn'
                        keepToken: false
                        actionOnNoFiles: 'continue'
                        enableTransforms: false
                        enableRecursion: false
                        useLegacyPattern: false
                        enableTelemetry: true
                                    
                  - task: Bash@3
                    displayName: 'Kubectl apply'
                    inputs:
                      targetType: 'inline'
                      script: |
                        cd $(Pipeline.Workspace)/drop
                        az login --identity
                        az account set --subscription 74a57460-013e-4db0-850b-86c4d083c797
                        az aks get-credentials --resource-group paz-qa-pfm-rg --name paz-qa-pfm-aks  --admin 2> /dev/null                          
                        kubelogin convert-kubeconfig -l azurecli
                        kubectl apply -f deployment.yaml                        
                      failOnStderr: true
                  
                  - template: azure-deployment-pipeline.yaml
                    parameters:
                      rgName: "paz-qa-pfm-rg"
                      clusterName: "paz-qa-pfm-aks"
                      subscription_id: "74a57460-013e-4db0-850b-86c4d083c797"

        - job: QA_Test
          displayName: Running Automation UI Test cases on qa env
          dependsOn: deploy_nghomeui_qa_eng
          steps:
          - template: azure-pipeline-run-automation-test.yaml
            parameters:
              env: "qa"
              type: "ui"
              test_tags: "@regression"
              pat_token: $(PAT)   
                              
        # - template: /templates/servicenow/template-progress-cr.yml@platformPipelineRepo
        #   parameters:
        #     snowConfig:    
        #       serviceConnection: 'ServiceNow-Connection'
        #       requireManualValidation: true          
        #     component:
        #       name: 'nghomeui'
        #       selfhostedpool: 'paz-vmss-pool'
        #     env_name: qa_snow  
        #     config:
 
    - stage: approval_gate
      displayName: "Approval_Gate Stage"
      dependsOn: qa
      jobs:
        - deployment: approval_gateDeploy
          displayName: "Deployment Job"
          environment: approval_gate_eng
          strategy:
            runOnce:
              deploy:
                steps:
                  - script: |
                      echo "Approval has been given for Prod"
                    displayName: 'Deployment to Approval_Gate'

  - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}: 
    - stage: prod
      displayName: Deployment to Prod
      dependsOn: approval_gate
      pool:
        name: 'paz-vmss-pool'
      variables:
        - group: 'ng-home-ui-Live'
      jobs:
        - template: /templates/servicenow/add-start-time.yml@platformPipelineRepo
          parameters:
            snowConfig:    
              serviceConnection: 'ServiceNow-Connection'
              requireManualValidation: false
              deploymentJobName: deploy_nghomeui_live     ###
            # component:
            #   name: 'ng-home-ui'
            #   selfhostedpool: 'paz-vmss-pool' 

        - template: /templates/servicenow/template-progress-cr.yml@platformPipelineRepo
          parameters:
            snowConfig:    
              serviceConnection: 'ServiceNow-Connection'
              requireManualValidation: true
              deploymentJobName: deploy_nghomeui_live     ###          
            # component:
            #   name: 'nghomeui'
            #   selfhostedpool: 'paz-vmss-pool'
            env_name: prod_eng  
            config:

        - deployment: deploy_nghomeui_live
          displayName: "Deployment to Prod"
          dependsOn: MoveCR
          environment: prod_eng         
          strategy:
            runOnce:
              deploy:
                steps:
                  - task: replacetokens@5
                    displayName: 'Replace Token in Deployment.YAML'
                    inputs:
                        rootDirectory: '$(Pipeline.Workspace)/drop'
                        targetFiles: 'deployment-live.yaml'
                        encoding: 'auto'
                        tokenPattern: 'default'
                        writeBOM: true
                        actionOnMissing: 'warn'
                        keepToken: false
                        actionOnNoFiles: 'continue'
                        enableTransforms: false
                        enableRecursion: false
                        useLegacyPattern: false
                        enableTelemetry: true

                  - task: bash@3
                    displayName: 'Kubectl apply'
                    inputs:
                      targetType: 'inline'
                      script: |
                        cd $(Pipeline.Workspace)/drop
                        az login --identity
                        az account set --subscription 3f82189b-c250-4516-9021-b2bebfb4c196
                        az aks get-credentials --resource-group paz-prd-ess-ng-rg --name paz-prd-ess-ng-aks  --admin 2> /dev/null 
                        kubectl apply -f deployment-live.yaml                         
                  
                  - template: azure-deployment-pipeline.yaml
                    parameters:
                      rgName: "paz-prd-ess-ng-rg"
                      clusterName: "paz-prd-ess-ng-aks"
                      subscription_id: "3f82189b-c250-4516-9021-b2bebfb4c196"

        - template: /templates/servicenow/template-close-cr.yml@platformPipelineRepo
          parameters:
            snowConfig:    
              serviceConnection: 'ServiceNow-Connection'
              requireManualValidation: false 
              deploymentJobName: deploy_nghomeui_live     ###          
            components:
              - name: 'nghomeui'
                selfhostedpool: 'paz-vmss-pool'
            env_name: prod_eng
            
        # - job: Live_Test
        #   displayName: Running Automation UI Test cases on live env
        #   dependsOn: deploy_nghomeui_live
        #   steps:
        #   - template: azure-pipeline-run-automation-test.yaml
        #     parameters:
        #       env: "live"
        #       type: "ui"
        #       test_tags: "@regression"
        #       pat_token: $(PAT)       

  - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    - stage: pre_prod
      displayName: Deployment to Pre_prod
      dependsOn: Build
      pool:
        name: 'paz-vmss-pool'
      variables:
        - group: 'ng-home-ui-perf'
      jobs:
        - deployment: Deploy_nghomeui_pre_prod
          displayName: "Deployment to Pre_Prod"
          environment: pre_prod_eng
          strategy:
            runOnce:
              deploy:
                steps:
                  - task: DownloadPipelineArtifact@2
                    inputs:
                      buildType: 'current'
                      artifactName: 'drop'
                      targetPath: '$(Pipeline.Workspace)/drop'

                  - task: replacetokens@5
                    displayName: 'Replace Token in Deployment.YAML'
                    inputs:
                        rootDirectory: '$(Pipeline.Workspace)/drop'
                        targetFiles: 'deployment.yaml'
                        encoding: 'auto'
                        tokenPattern: 'default'
                        writeBOM: true
                        actionOnMissing: 'warn'
                        keepToken: false
                        actionOnNoFiles: 'continue'
                        enableTransforms: false
                        enableRecursion: false
                        useLegacyPattern: false
                        enableTelemetry: true   

                  - task: Bash@3
                    displayName: 'Kubectl apply'
                    inputs:
                      targetType: 'inline'
                      script: |
                        cd $(Pipeline.Workspace)/drop
                        az login --identity
                        az account set --subscription 74a57460-013e-4db0-850b-86c4d083c797
                        az aks get-credentials --resource-group paz-perf-ess-ng-rg --name paz-perf-ess-ng-aks --admin 2> /dev/null
                        kubectl apply -f deployment.yaml                        
                      failOnStderr: true
                  
                  - template: azure-deployment-pipeline.yaml
                    parameters:
                      rgName: "paz-perf-ess-ng-rg"
                      clusterName: "paz-perf-ess-ng-aks"
                      subscription_id: "74a57460-013e-4db0-850b-86c4d083c797" 